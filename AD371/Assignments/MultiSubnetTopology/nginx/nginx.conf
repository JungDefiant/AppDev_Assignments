# Base nginx configuration, uploaded by Terraform.
#
# Mirrors the stock nginx:alpine config except for `worker_processes 1`,
# which gives the load balancer a single worker with ONE Round-Robin state,
# so consecutive requests rotate through the upstream pool in strict order
# (backend-1 -> backend-2 -> pybackend-1 -> pybackend-2 -> ...).

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

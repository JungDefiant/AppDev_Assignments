# Reverse proxy for the `web` service replicas.
#
# 127.0.0.11 is Docker's embedded DNS server. Because `proxy_pass` uses a
# variable (instead of a static `upstream` block), nginx re-resolves the
# `web` service name at runtime every `valid=` seconds, and Docker's DNS
# answers round-robin across all replica container IPs -> load balancing.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Resolved per request via the resolver above.
    set $app_upstream http://web:8080;

    location / {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
